    <script>
      // ตั้งธีม ภาษา และขนาดเมนูก่อนหน้าเว็บแสดง เพื่อไม่ให้หน้ากะพริบ
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('ttm_theme');
        if (t) d.dataset.theme = t;

        var mc = document.createElement('meta');
        mc.name = 'theme-color';
        mc.content = t === 'dark' ? '#16171a' : '#f8f6f5';
        document.head.appendChild(mc);

        var p = JSON.parse(localStorage.getItem('ttm_pf') || '{}');
        if (p.lang) d.lang = p.lang;

        var s = localStorage.getItem('ttm_sb');
        if (s === '1' || (s === null && innerWidth < 1100)) d.classList.add('sb-mini');
      } catch (e) {}
    </script>
