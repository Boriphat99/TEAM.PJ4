<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T&T Mansion Payment System</title>
    <meta name="description" content="ระบบชำระค่าบริการหอพัก T&T แมนชั่น — ดูบิล สแกนจ่าย PromptPay แนบสลิป ออนไลน์">
    <link rel="manifest" href="static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="T&T Mansion">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://hpliogcnsxtnrvuyykzd.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // ตั้งธีม ภาษา และขนาดเมนูก่อนหน้าเว็บแสดง เพื่อไม่ให้หน้ากะพริบ
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('ttm_theme');
        if (t) d.dataset.theme = t;

        var mc = document.createElement('meta');
        mc.name = 'theme-color';
        mc.content = t === 'dark' ? '#16171a' : '#f8f6f5';
        document.head.appendChild(mc);

        var p = JSON.parse(localStorage.getItem('ttm_pf') || '{}');
        if (p.lang) d.lang = p.lang;

        var s = localStorage.getItem('ttm_sb');
        if (s === '1' || (s === null && innerWidth < 1100)) d.classList.add('sb-mini');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css?v=6ffa33bb">
    <style>/* วอลเปเปอร์หน้าต้อนรับ (อ้าง path จากหน้าเว็บ) */
        :root { --hp-bg-l: url('static/bg-photo-d.webp'); --hp-bg-d: url('static/bg-photo-d.webp'); --hp-bg-lm: url('static/bg-photo-d-m.webp'); --hp-bg-dm: url('static/bg-photo-d-m.webp') }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="mo" onclick="if(event.target==this)cm()">
        <div class="cd" id="mc"></div>
    </div>
    <div id="dg"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

</body>

</html>
